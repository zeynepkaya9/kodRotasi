version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jsy-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jsy_platform}
      POSTGRES_USER: ${POSTGRES_USER:-jsy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jsy-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
